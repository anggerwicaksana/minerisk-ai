<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="amberHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Shadow & Hexagon Base -->
  <polygon points="32,3 59,17.5 59,46.5 32,61 5,46.5 5,17.5" fill="url(#amberHex)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Subtle Chamfer Highlight -->
  <polygon points="32,6 55,19 55,45 32,58 9,45 9,19" fill="none" stroke="url(#innerGlow)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Bold Crossed Mining Pickaxes (High Contrast Charcoal) -->
  <g fill="#0F172A" stroke="#0F172A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pick Handles -->
    <line x1="16" y1="48" x2="48" y2="16" stroke-width="5"/>
    <line x1="48" y1="48" x2="16" y2="16" stroke-width="5"/>
    
    <!-- Top-Left Pick Head -->
    <path d="M12 24 C14 16 22 13 26 12 C22 17 21 21 21 26 Z" fill="#0F172A" stroke-width="1"/>
    <!-- Top-Right Pick Head -->
    <path d="M52 24 C50 16 42 13 38 12 C42 17 43 21 43 26 Z" fill="#0F172A" stroke-width="1"/>
    
    <!-- Handle Grips / Ends -->
    <circle cx="16" cy="48" r="3.2" fill="#78350F" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="3.2" fill="#78350F" stroke="#0F172A" stroke-width="1.5"/>
    
    <!-- Center Safety Rivet -->
    <circle cx="32" cy="32" r="4.2" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  </g>
</svg>
